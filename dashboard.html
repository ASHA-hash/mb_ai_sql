/* ═══════════════════════════════════════════════════════════════
   SALES PERIOD PANEL — Today / MTD / QTD / YTD / Last 6M
   with switchable Group-by: Branch | Department | Category | Date
═══════════════════════════════════════════════════════════════ */

/* Convert JS Date to dd.mm.yyyy which the API filter expects */
function toDMY(d) {
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}.${mm}.${d.getFullYear()}`;
}

function getPeriodRange(period) {
  const now  = new Date();
  const today = toDMY(now);
  const yr = now.getFullYear();
  const mo = now.getMonth(); // 0=Jan … 11=Dec
  let from;
  let to = today;
  switch (period) {
    case 'today': from = today; break;
    case 'yesterday': {
      const d = new Date(now);
      d.setDate(d.getDate() - 1);
      from = toDMY(d);
      to = from;
      break;
    }
    case 'mtd':   from = toDMY(new Date(now.getFullYear(), now.getMonth(), 1)); break;
    case 'qtd': {
      /* Indian FY quarters: Q1=Apr-Jun(3-5), Q2=Jul-Sep(6-8), Q3=Oct-Dec(9-11), Q4=Jan-Mar(0-2) */
      let qStartMonth;
      if      (mo >= 9) qStartMonth = 9;  // Q3 starts Oct
      else if (mo >= 6) qStartMonth = 6;  // Q2 starts Jul
      else if (mo >= 3) qStartMonth = 3;  // Q1 starts Apr
      else              qStartMonth = 0;  // Q4 starts Jan
      from = toDMY(new Date(yr, qStartMonth, 1)); break;
    }
    case 'ytd': {
      /* Indian FY YTD: Apr 1 of current financial year */
      const fyStartYear = mo >= 3 ? yr : yr - 1;
      from = toDMY(new Date(fyStartYear, 3, 1)); break;
    }
    case '6m': {
      /* Last 6 months including current month: current + previous 5 */
      const d = new Date(now); d.setMonth(d.getMonth() - 5); d.setDate(1);
      from = toDMY(d); break;
    }
    default: from = today;
  }
  return { from, to };
}

/* Strip ZWSP/BOM; trim — category keys from SQL often have invisible chars */
function stripInvisible(s) {
  return String(s ?? '').replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
}
/**
 * Placeholder / junk dimension values to exclude from bar charts (and from summing as a named bucket).
 * Covers exact "Unknown", common misspellings, N/A, and SQL null sentinels.
 */
function isJunkGroupKey(s) {
  const key = stripInvisible(s);
  if (!key) return true;
  const low = key.toLowerCase();
  if (/^n\/?a$/i.test(key) || /^#n\/?a$/i.test(key)) return true;
  if (low === 'null' || low === 'none' || low === 'undefined' || low === '?' || low === '—' || low === '-') return true;
  if (low === 'not applicable' || low === 'not available' || low === 'tbd' || low === 'tbc') return true;
  const compact = low.replace(/[^a-z0-9]/g, '');
  if (compact.length === 0) return true;
  if (compact === 'na' || compact === 'null' || compact === 'none') return true;
  if (compact === 'unknown' || compact === 'unkown' || compact === 'unkonw' || compact === 'unknwn' || compact === 'unknow') return true;
  if (/^unknown(\b|_|$)/i.test(low)) return true;
  return false;
}

/** Normalize a cell to YYYY-MM-DD for daily buckets; returns '' if not parseable. */
function toDayKeyFromCell(v) {
  if (v == null || v === '') return '';
  if (v instanceof Date && !isNaN(v)) {
    return `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, '0')}-${String(v.getDate()).padStart(2, '0')}`;
  }
  const s = String(v).trim();
  if (!s) return '';
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const d = new Date(s);
  if (isNaN(d)) return '';
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

/* Aggregate raw rows by a grouping column, summing a value column */
function aggregateBy(rows, groupCol, valueCol) {
  if (!groupCol || !rows.length) return [];
  const map = {};
  rows.forEach(r => {
    const key = stripInvisible(r[groupCol]);
    if (isJunkGroupKey(key)) return;
    const val = parseFloat(r[valueCol]) || 0;
    map[key] = (map[key] || 0) + val;
  });
  if (!Object.keys(map).length) {
    return [{ label: "No mapped values", value: 0 }];
  }
  return Object.entries(map)
    .map(([label, value]) => ({ label, value }))
    .sort((a, b) => b.value - a.value);
}

/* Aggregate by date column, summing value column */
function aggregateByDate(rows, dateCol, valueCol) {
  if (!dateCol || !rows.length) return [];
  const map = {};
  rows.forEach(r => {
    const dayKey = toDayKeyFromCell(r[dateCol]);
    if (!dayKey) return;
    const val = parseFloat(r[valueCol]) || 0;
    map[dayKey] = (map[dayKey] || 0) + val;
  });
  return Object.entries(map)
    .sort(([a],[b]) => a.localeCompare(b))
    .map(([label, value]) => ({ label, value }));
}

/* Aggregate by month key YYYY-MM from date column */
function aggregateByMonth(rows, dateCol, valueCol) {
  if (!dateCol || !rows.length) return [];
  const map = {};
  rows.forEach(r => {
    const raw = String(r[dateCol] ?? '');
    const d = new Date(raw);
    if (isNaN(d)) return;
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const val = parseFloat(r[valueCol]) || 0;
    map[key] = (map[key] || 0) + val;
  });
  return Object.entries(map)
    .sort(([a],[b]) => a.localeCompare(b))
    .map(([label, value]) => ({ label, value }));
}

/** Normalize trend period_label to a stable key for YoY alignment (yyyy-mm-dd or yyyy-mm). */
function canonicalTrendLabelKey(lbl) {
  const s = String(lbl ?? "").trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  if (/^\d{4}-\d{2}$/.test(s)) return s;
  const iso = toDayKeyFromCell(s);
  return iso || s;
}

/** Map current-period key → prior-year key (same month/day or same fiscal month bucket). */
function priorYearTrendKey(canonicalKey) {
  const k = String(canonicalKey || "");
  const day = /^(\d{4})-(\d{2})-(\d{2})$/.exec(k);
  if (day) {
    const d = new Date(Date.UTC(Number(day[1]), Number(day[2]) - 1, Number(day[3])));
    if (Number.isNaN(d.getTime())) return null;
    d.setUTCFullYear(d.getUTCFullYear() - 1);
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`;
  }
  const mo = /^(\d{4})-(\d{2})$/.exec(k);
  if (mo) return `${Number(mo[1]) - 1}-${mo[2]}`;
  return null;
}

/** Combine multiple DB rows sharing the same trend bucket (fixes repeated X-axis labels / double-count visuals). */
function aggregateTrendChartRows(rows) {
  if (!rows?.length) return [];
  const map = new Map();
  const order = [];
  for (const r of rows) {
    const k = canonicalTrendLabelKey(r.label);
    if (!k) continue;
    if (!map.has(k)) {
      order.push(k);
      map.set(k, {
        label: String(r.label ?? ''),
        TotalSales: parseFloat(r.TotalSales) || 0,
        InvoiceCount: r.InvoiceCount != null ? parseFloat(r.InvoiceCount) || 0 : null,
      });
    } else {
      const agg = map.get(k);
      agg.TotalSales += parseFloat(r.TotalSales) || 0;
      if (r.InvoiceCount != null) {
        agg.InvoiceCount = (agg.InvoiceCount || 0) + (parseFloat(r.InvoiceCount) || 0);
      }
    }
  }
  return order.map((k) => {
    const o = map.get(k);
    const out = {
      label: /^\d{4}-\d{2}-\d{2}$/.test(k) ? `${k.slice(8, 10)}-${k.slice(5, 7)}-${k.slice(0, 4)}` : /^\d{4}-\d{2}$/.test(k) ? k : o.label,
      TotalSales: o.TotalSales,
    };
    if (o.InvoiceCount != null && Number.isFinite(o.InvoiceCount)) out.InvoiceCount = o.InvoiceCount;
    return out;
  });
}

function normalizeDateToDMY(s) {
  const raw = String(s || '').trim();
  if (!raw) return '';
  if (/^\d{2}\.\d{2}\.\d{4}$/.test(raw)) return raw;
  if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) {
    const [y, m, d] = raw.split('-');
    return `${d}.${m}.${y}`;
  }
  const m1 = raw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m1) {
    const dd = String(parseInt(m1[1], 10)).padStart(2, '0');
    const mm = String(parseInt(m1[2], 10)).padStart(2, '0');
    return `${dd}.${mm}.${m1[3]}`;
  }
  return '';
}

function parseFromToDateRange(question) {
  const q = String(question || '');
  const m = q.match(/from\s+(\d{1,2}[./-]\d{1,2}[./-]\d{4}|\d{4}-\d{2}-\d{2})\s+to\s+(\d{1,2}[./-]\d{1,2}[./-]\d{4}|\d{4}-\d{2}-\d{2})/i);
  if (!m) return null;
  const from = normalizeDateToDMY(m[1]);
  const to = normalizeDateToDMY(m[2]);
  if (!from || !to) return null;
  return { from, to };
}

function detectSalesDashboardIntent(question) {
  const q = String(question || '').toLowerCase();
  const salesLike = /\b(sale|sales|revenue|invoice)\b/.test(q);
  const pToday = /\b(today|today'?s)\b/.test(q);
  const pYesterday = /\b(yesterday|yday|yday'?s)\b/.test(q);
  const pMtd = /\b(mtd|month[\s-]*to[\s-]*date|this month)\b/.test(q);
  const pQtd = /\b(qtd|quarter[\s-]*to[\s-]*date|this quarter)\b/.test(q);
  const pYtd = /\b(ytd|year[\s-]*to[\s-]*date|this year)\b/.test(q);
  const p6m = /\b(last\s*6\s*months?|last\s*six\s*months?)\b/.test(q);
  const pCustom = !!parseFromToDateRange(q);
  const explicitDateMatches = q.match(/\b\d{1,2}[./-]\d{1,2}[./-]\d{4}\b|\b\d{4}-\d{2}-\d{2}\b/g) || [];
  const hasDatePointSetCompare = explicitDateMatches.length >= 2;
  const hasCompareOperator = /\b(compare|vs|versus|against)\b/.test(q);

  // ── Specificity guard ────────────────────────────────────────────────────────
  // If the question names a SPECIFIC entity (branch code/name, supplier, category,
  // department, item, customer, salesperson), the generic multi-chart dashboard
  // is the WRONG answer — route to the AI engine instead so it can filter properly.
  const hasSpecificFilter =
    // Branch codes like "01-SE", "08-VK", numeric branch ids
    /\b\d{2}-[A-Z]{2,4}\b/i.test(q) ||
    // "for branch X", "branch X", "for store X"
    /\b(branch|store|outlet)\s+[\w\-]+/.test(q) ||
    // "for <named entity>" — supplier, vendor, category, dept, customer, item, salesperson
    /\bfor\s+(branch|store|supplier|vendor|category|dept|department|customer|item|product|salesperson|employee)\b/.test(q) ||
    // "by department X / category X" when a name follows
    /\b(department|category|dept|cat)\s+[A-Z][A-Z]+/.test(q) ||
    // Explicit comparison operators
    hasCompareOperator ||
    // Multiple specific dates in one query => must go to deterministic compare path
    hasDatePointSetCompare ||
    // Ranking / top-N, or stock/purchase/supplier queries → AI engine
    /\btop\s+\d+\b/.test(q) ||
    /\b(stock|purchase|return|supplier|vendor|product|item)\b/.test(q) ||
    // Unique / distinct count → needs COUNT DISTINCT SQL, send to AI engine
    /\b(unique|distinct)\s+\w/.test(q) ||
    // Explicit count-metric questions about a specific dimension → AI engine
    /\b(customer\s+count|invoice\s+count|transaction\s+count)\b/.test(q) ||
    // Specific named locations or values in quotes
    /["'][^"']{2,}["']/.test(q);

  if (hasSpecificFilter) return null;  // ← send to AI engine, not dashboard

  if (!salesLike && !(pToday || pYesterday || pMtd || pQtd || pYtd || p6m || pCustom)) return null;

  if (pToday) return "today";
  if (pYesterday) return "yesterday";
  if (pMtd) return "mtd";
  if (pQtd) return "qtd";
  if (pYtd) return "ytd";
  if (p6m) return "6m";
  if (pCustom) return "custom";
  return null;
}

const PERIODS = [
  { key: 'today', label: "Today" },
  { key: 'mtd',   label: "MTD"   },
  { key: 'qtd',   label: "QTD"   },
  { key: 'ytd',   label: "YTD"   },
  { key: '6m',    label: "Last 6M"},
];

const GROUP_OPTIONS = [
  { key: 'branch', label: "Branch Alias", col: "BranchAlias",         fallbacks: ["BranchName","Branch","BranchCode","BranchId"]         },
  { key: 'dept',   label: "Department",   col: "DepartmentShortName", fallbacks: ["DepartmentName","Department","DeptName","Dept"]        },
  { key: 'cat',    label: "Category",     col: "CategoryShortName",   fallbacks: ["CategoryName","Category","Cat","CategoryCode","ItemCategory"] },
  { key: 'date',   label: "Date-wise",    col: null /* special */                                                                         },
];

/**
 * Given the actual data rows and a GROUP_OPTIONS entry, returns the best
 * available column name — trying the primary col first, then fallbacks,
 * picking whichever has at least one non-junk value.
 */
function resolveGroupCol(rows, opt) {
  if (!opt || !rows?.length) return opt?.col || null;
  const available = Object.keys(rows[0]).map(k => k.toLowerCase());
  const candidates = [opt.col, ...(opt.fallbacks || [])].filter(Boolean);
  for (const c of candidates) {
    const actual = Object.keys(rows[0]).find(k => k.toLowerCase() === c.toLowerCase());
    if (!actual) continue;
    const hasReal = rows.some(r => !isJunkGroupKey(String(r[actual] ?? '')));
    if (hasReal) return actual;
  }
  // All candidates yield only junk — return null so caller can show a message
  return null;
}

/* Which group-by keys need an AI JOIN query (no direct column in sales view) */
const AI_GROUPBY_KEYS = ['cat', 'dept'];

/* AI question templates for Category and Department */
function buildAIGroupQuestion(groupKey, from, to) {
  const f = dmyToISO(from);
  const t = dmyToISO(to);
  if (groupKey === 'kpi_total') {
    return `Total sales amount and transaction count from ${f} to ${t}. Use dbo.VwAISalesData. ` +
      `SELECT SUM(SaleNetAmount) AS TotalSales, COUNT(*) AS TransactionCount ` +
      `FROM dbo.VwAISalesData WHERE CAST(InvoiceDt AS date) BETWEEN '${f}' AND '${t}'.`;
  }
  if (groupKey === 'trend_daily') {
    return `Day-wise sales AND invoice count AND customer count from ${f} to ${t}. Use dbo.VwAISalesData. ` +
      `SELECT CONVERT(varchar(12), CAST(InvoiceDt AS date), 105) AS SaleDate, ` +
      `SUM(SaleNetAmount) AS TotalSales, COUNT(DISTINCT InvoiceNo) AS InvoiceCount, COUNT(DISTINCT CustomerId) AS CustomerCount ` +
      `FROM dbo.VwAISalesData WHERE CAST(InvoiceDt AS date) BETWEEN '${f}' AND '${t}' ` +
      `GROUP BY CAST(InvoiceDt AS date) ORDER BY CAST(InvoiceDt AS date) ASC.`;
  }
  if (groupKey === 'trend_monthly') {
    return `Month-wise sales AND invoice count AND customer count from ${f} to ${t}. Use dbo.VwAISalesData. ` +
      `SELECT FORMAT(InvoiceDt, 'MMM yyyy') AS SaleMonth, ` +
      `SUM(SaleNetAmount) AS TotalSales, COUNT(DISTINCT InvoiceNo) AS InvoiceCount, COUNT(DISTINCT CustomerId) AS CustomerCount ` +
      `FROM dbo.VwAISalesData WHERE CAST(InvoiceDt AS date) BETWEEN '${f}' AND '${t}' ` +
      `GROUP BY YEAR(InvoiceDt), MONTH(InvoiceDt), FORMAT(InvoiceDt,'MMM yyyy') ` +
      `ORDER BY YEAR(InvoiceDt), MONTH(InvoiceDt) ASC.`;
  }
  if (groupKey === 'branch') {
    return `Top 30 branches by total SaleNetAmount from ${f} to ${t}. ` +
      `JOIN dbo.VwAISalesData s WITH dbo.VwMstBranchEntry b ON s.BranchId = b.BranchId. ` +
      `WHERE CAST(s.InvoiceDt AS date) BETWEEN '${f}' AND '${t}'. ` +
      `Group by BranchAlias (use BranchName if BranchAlias not available), ` +
      `sum SaleNetAmount, order by total descending.`;
  }
  if (groupKey === 'cat') {
    return `Top 20 item categories by total SaleNetAmount from ${f} to ${t}. ` +
      `Join dbo.VwAISalesData with dbo.VwMstItems on ItemId. ` +
      `WHERE CAST(InvoiceDt AS date) BETWEEN '${f}' AND '${t}'. ` +
      `Group by CategoryShortName, sum SaleNetAmount, order by total descending.`;
  }
  if (groupKey === 'dept') {
    return `Top 20 departments by total SaleNetAmount from ${f} to ${t}. ` +
      `Use ONLY dbo.VwAISalesData. Do NOT join Branch tables. ` +
      `WHERE CAST(InvoiceDt AS date) BETWEEN '${f}' AND '${t}'. ` +
      `Group by DepartmentShortName (NOT BranchAlias, NOT BranchName — department only), ` +
      `sum SaleNetAmount, order by total descending.`;
  }
  return '';
}

/* Pick the best label column from AI query result rows */
function pickAILabelCol(rows, groupKey) {
  if (!rows?.length) return null;
  const keys = Object.keys(rows[0]);
  if (groupKey === 'branch') {
    return keys.find(k => /alias/i.test(k) && !/amount|net|total|value|sale/i.test(k))
      || keys.find(k => /branch/i.test(k) && !/id|amount|net|total|value|sale/i.test(k))
      || keys.find(k => /name/i.test(k) && !/amount|net|total|value|sale/i.test(k))
      || keys[0];
  }
  if (groupKey === 'cat') {
    return keys.find(k => /category|cat/i.test(k) && !/amount|net|total|value|sale/i.test(k))
      || keys.find(k => /name|desc|short/i.test(k))
      || keys[0];
  }
  if (groupKey === 'dept') {
    return keys.find(k => /dept|department/i.test(k) && !/amount|net|total|value|sale/i.test(k))
      || keys.find(k => /name|desc|short/i.test(k))
      || keys[0];
  }
  return keys[0];
}

/* Pick the best value column from AI query result rows */
function pickAIValueCol(rows) {
  if (!rows?.length) return null;
  const keys = Object.keys(rows[0]);
  const preferred = ['TotalSaleNetAmount','SaleNetAmount','TotalAmount','NetAmount','Amount','Total','Value','Revenue'];
  return preferred.find(p => keys.some(k => k.toLowerCase() === p.toLowerCase()))
    || keys.find(k => /amount|net|total|sale|revenue|value/i.test(k))
    || keys[1] || keys[0];
}

function SalesPeriodPanel({ auth }) {
  const [period,        setPeriod]      = useState('mtd');
  const [loading,       setLoading]     = useState(false);
  const [rows,          setRows]        = useState(null);     // flat dataset rows (kept for KPI stats)
  const [periodMeta,    setPeriodMeta]  = useState(null);     // server period window (source of truth)
  const [kpiTotal,      setKpiTotal]    = useState(0);
  const [kpiTxCount,    setKpiTxCount]  = useState(0);
  const [trendAiRows,   setTrendAiRows]  = useState(null);   // AI trend rows (daily or monthly)
  const [pyTrendRows,   setPyTrendRows]  = useState(null);   // prior-year trend rows (YoY comparison)
  const [pyKpiTotal,    setPyKpiTotal]   = useState(null);   // prior-year total sales
  const [branchAiRows,  setBranchAiRows] = useState(null);   // AI branch rows (BranchAlias)
  const [deptAiRows,    setDeptAiRows]  = useState(null);    // AI dept rows
  const [catAiRows,     setCatAiRows]   = useState(null);    // AI cat rows
  const [error,         setError]       = useState('');
  const [config,      setConfig]      = useState(null);

  /* Detect which dataset is sales */
  useEffect(() => {
    apiFetch('/api/connector-config', { token: auth.token })
      .then(d => setConfig(d)).catch(() => {});
  }, [auth.token]);

  const salesDataset = useMemo(() => {
    if (!config?.datasets) return null;
    return config.datasets.find(d =>
      /sales|invoice|vwai/i.test(d.key) || /sales|invoice/i.test(d.objectName)
    ) || config.datasets[0];
  }, [config]);

  /* Best numeric column for flat-dataset aggregation */
  const valueCol = useMemo(() => {
    if (!rows?.length) return null;
    const preferred = ['SaleNetAmount','NetAmount','Amount','SalesAmount','Revenue','Total','Value'];
    const keys = Object.keys(rows[0]);
    return preferred.find(p => keys.some(k => k.toLowerCase() === p.toLowerCase()))
      || keys.find(k => /amount|net|sale|revenue|total|value/i.test(k) && isNumericCol(rows, k))
      || keys.find(k => isNumericCol(rows, k));
  }, [rows]);

  /* Date column detection */
  const dateCol = useMemo(() => {
    if (!rows?.length) return null;
    const keys = Object.keys(rows[0]);
    return keys.find(k => /invoicedt|date|dt|day|created/i.test(k)) || null;
  }, [rows]);

  /* Prior-year window: calendar-safe (month lengths, leap years) vs naive string year +/-. */
  function priorYearRange(fromDMY, toDMY) {
    function parseDMY(dmy) {
      const p = String(dmy || '').split('.');
      if (p.length !== 3) return null;
      const dd = parseInt(p[0], 10);
      const mm = parseInt(p[1], 10);
      const yy = parseInt(p[2], 10);
      if (!Number.isFinite(dd) || !Number.isFinite(mm) || !Number.isFinite(yy)) return null;
      const dt = new Date(yy, mm - 1, dd);
      return isNaN(dt.getTime()) ? null : dt;
    }
    const a = parseDMY(fromDMY);
    const b = parseDMY(toDMY);
    if (a && b) {
      const pf = new Date(a);
      pf.setFullYear(pf.getFullYear() - 1);
      const pt = new Date(b);
      pt.setFullYear(pt.getFullYear() - 1);
      return { from: toDMY(pf), to: toDMY(pt) };
    }
    function shiftYear(dmy, delta) {
      const [d, m, y] = dmy.split('.');
      return `${d}.${m}.${parseInt(y, 10) + delta}`;
    }
    return { from: shiftYear(fromDMY, -1), to: shiftYear(toDMY, -1) };
  }

  /* Home Sales panel should use deterministic analytics API, not AI-generated SQL. */
  async function loadAll(p) {
    if (!salesDataset) return;
    const activePeriod = p || period;
    setLoading(true); setError('');
    setKpiTotal(0); setKpiTxCount(0);
    setPeriodMeta(null); setPyTrendRows(null); setPyKpiTotal(null);
    setRows(null); setTrendAiRows(null); setBranchAiRows(null); setDeptAiRows(null); setCatAiRows(null);
    const { from, to } = getPeriodRange(activePeriod);

    /* Long periods (QTD / YTD / 6M) use the two-phase approach:
       phase 1 → critical (KPI + trend only, fast)
       phase 2 → widgets (branch / dept / category, background)
       This prevents a single massive query from timing out at 120 s and
       crashing the whole panel with "dashboard_unavailable". */
    const dashboardTimeoutMs = ERP_ANALYTICS_TIMEOUT_MS;

    async function postSalesDashboard(body) {
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          const resp = await apiFetch('/api/analytics/dashboard', {
            method: 'POST',
            token: auth.token,
            timeoutMs: dashboardTimeoutMs,
            body,
          });
          if (resp && resp.kpi) return resp;
        } catch (_) {
          /* retry once */
        }
        if (attempt === 0) await new Promise((r) => setTimeout(r, 900));
      }
      return null;
    }

    try {
      /* ── Phase 1: Critical (KPI + trend) ─────────────────────────── */
      const params = new URLSearchParams({ limit: '2000', from, to });
      const flatPromise = apiFetch(
        `/api/dataset/${encodeURIComponent(salesDataset.key)}?${params}`,
        { token: auth.token }
      ).then(d => Array.isArray(d) ? d : []).catch(() => []);

      /* Prior-year comparison — uses period:'custom' + ISO dates so the backend
         doesn't silently fall back to MTD (which was the root cause of identical LY/CY). */
      const { from: pyFrom, to: pyTo } = priorYearRange(from, to);
      const pyBody =
        activePeriod !== 'today'
          ? {
              period: 'custom',
              custom: { from: dmyToISO(pyFrom), to: dmyToISO(pyTo) },
              dataset: 'sales',
              loadPhase: 'critical',
              compact: true,
            }
          : null;
      const pyPromise =
        pyBody && dmyToISO(pyFrom) && dmyToISO(pyTo)
          ? postSalesDashboard(pyBody).catch(() => null)
          : Promise.resolve(null);

      /* Always send explicit ISO window (matches subtitle + aligns with server `6m` calendar rule). */
      const cyCustom =
        dmyToISO(from) && dmyToISO(to)
          ? { from: dmyToISO(from), to: dmyToISO(to) }
          : null;
      const criticalBody = cyCustom
        ? {
            period: 'custom',
            custom: cyCustom,
            dataset: 'sales',
            loadPhase: 'critical',
            compact: true,
          }
        : { period: activePeriod, dataset: 'sales', loadPhase: 'critical', compact: true };
      const criticalPromise = postSalesDashboard(criticalBody);

      const [flatData, critical, pyDash] = await Promise.all([flatPromise, criticalPromise, pyPromise]);
      setRows(flatData);

      if (!critical || !critical.kpi) {
        throw new Error('analytics_dashboard_unavailable');
      }

      const k = critical.kpi || {};
      const pMeta = critical.period || null;
      setPeriodMeta(pMeta);
      setKpiTotal(parseFloat(k.totalSales) || 0);
      setKpiTxCount(parseInt(String(k.txnCount), 10) || 0);

      /* Trend from critical payload */
      const wCrit = critical.widgets || {};
      setTrendAiRows(wCrit.byTrend && Array.isArray(wCrit.byTrend.rows) ? wCrit.byTrend.rows : []);

      /* Prior year */
      if (pyDash && pyDash.kpi) {
        setPyKpiTotal(parseFloat(pyDash.kpi.totalSales) || 0);
        const pw = pyDash.widgets || {};
        setPyTrendRows(pw.byTrend && Array.isArray(pw.byTrend.rows) ? pw.byTrend.rows : []);
      }

      /* Widgets are now visible with placeholder, can clear loading spinner early */
      setLoading(false);

      /* ── Phase 2: Widgets (branch / dept / cat) ───────────────────── */
      /* Fire separately — if this times out, KPIs + trend are already shown */
      try {
        const widgets = await apiFetch('/api/analytics/dashboard', {
          method: 'POST',
          token: auth.token,
          timeoutMs: dashboardTimeoutMs,
          body: cyCustom
            ? {
                period: 'custom',
                custom: cyCustom,
                dataset: 'sales',
                loadPhase: 'widgets',
                compact: true,
              }
            : { period: activePeriod, dataset: 'sales', loadPhase: 'widgets', compact: true },
        });
        if (widgets && widgets.widgets) {
          const w = widgets.widgets;
          setBranchAiRows(w.byBranch && Array.isArray(w.byBranch.rows) ? w.byBranch.rows : []);
          setDeptAiRows(w.byDepartment && Array.isArray(w.byDepartment.rows) ? w.byDepartment.rows : []);
          setCatAiRows(w.byCategory && Array.isArray(w.byCategory.rows) ? w.byCategory.rows : []);
        }
      } catch (widgetErr) {
        /* Widget timeout is non-fatal — KPIs + trend are already displayed */
        console.warn('[SalesPeriodPanel] widgets phase timed out or failed:', widgetErr.message);
      }

    } catch(e) { setError(e.message); setLoading(false); }
  }

  useEffect(() => { if (salesDataset) loadAll(period); }, [salesDataset]);

  function handlePeriod(p) { setPeriod(p); loadAll(p); }

  /* Total from flat rows */
  const total = kpiTotal;

  const periodLabel = PERIODS.find(p => p.key === period)?.label || String(period || '').toUpperCase();
  const fallbackRange = getPeriodRange(period);
  const from = (periodMeta && periodMeta.from) || fallbackRange.from;
  const to = (periodMeta && periodMeta.to) || fallbackRange.to;
  const txCount = kpiTxCount ? kpiTxCount.toLocaleString() + ' transactions' : '';
  const displayValueCol = 'SaleNetAmount';

  /* Pill style helper */
  const pill = (active) => ({
    padding: '5px 14px', borderRadius: 20, border: 'none', cursor: 'pointer',
    fontSize: 12, fontWeight: 700, transition: 'all 0.15s',
    background: active ? 'var(--brand,#2563eb)' : 'var(--bg-muted,#f1f5f9)',
    color: active ? '#fff' : 'var(--text-muted,#64748b)',
    boxShadow: active ? '0 2px 8px rgba(99,102,241,.3)' : 'none',
  });

  /* Build chart rows for branch from analytics dashboard rows. */
  const branchChartRows = useMemo(() => {
    if (branchAiRows?.length) {
      const labelCol = pickAILabelCol(branchAiRows, 'branch');
      const valCol   = pickAIValueCol(branchAiRows);
      return branchAiRows
        .map(r => ({ label: String(r[labelCol] ?? ''), _v: parseFloat(r[valCol]) || 0 }))
        .filter(r => r.label && !isJunkGroupKey(r.label) && r._v > 0)
        .sort((a, b) => b._v - a._v)
        .slice(0, 30)
        .map(r => ({ label: r.label, SaleNetAmount: r._v }));
    }
    // Flat fallback if dashboard payload is temporarily unavailable.
    if (!rows?.length || !valueCol) return [];
    const branchOpt = GROUP_OPTIONS.find(o => o.key === 'branch');
    const col = resolveGroupCol(rows, branchOpt);
    if (!col) return [];
    return aggregateBy(rows, col, valueCol).slice(0, 30).map(r => ({ label: r.label, [valueCol]: r.value }));
  }, [branchAiRows, rows, valueCol]);

  /* Helper: extract metric_value from an analytics byTrend rows array */
  function extractTrendSeries(aiRows) {
    if (!aiRows?.length) return [];
    const keys = Object.keys(aiRows[0]);
    const labelCol = keys.find(k => /period_label|date|month|day/i.test(k)) || keys[0];
    const salesCol = keys.find(k => /metric_value|totalsales|saleamount|salenetamount|netsales/i.test(k))
                  || keys.find(k => /sales|amount|net|revenue/i.test(k) && !/count/i.test(k))
                  || keys[1];
    if (!labelCol || !salesCol) return [];
    return aiRows.filter(r => r[labelCol] != null).map(r => ({
      label: String(r[labelCol]),
      value: parseFloat(r[salesCol]) || 0,
    }));
  }

  /* Trend chart rows from analytics dashboard byTrend rows.
     Includes prior-year series for YoY comparison. */
  const trendChartRows = useMemo(() => {
    let currentRows = [];
    if (trendAiRows?.length) {
      const keys = Object.keys(trendAiRows[0]);
      const labelCol = keys.find(k => /period_label|date|month|day|saledate|salemonth/i.test(k)) || keys[0];
      const salesCol = keys.find(k => /metric_value|totalsales|saleamount|salenetamount|netsales/i.test(k))
                    || keys.find(k => /sales|amount|net|revenue/i.test(k) && !/count/i.test(k))
                    || keys[1];
      const invoiceCountCol = keys.find(k => /invoicecount|invoice.*count|txn_count/i.test(k));
      if (labelCol && salesCol) {
        currentRows = trendAiRows.filter(r => r[labelCol] != null).map(r => {
          const row = { label: String(r[labelCol]), TotalSales: parseFloat(r[salesCol]) || 0 };
          if (invoiceCountCol) row.InvoiceCount = parseFloat(r[invoiceCountCol]) || 0;
          return row;
        });
      }
    } else if (rows?.length && valueCol && dateCol) {
      // Flat fallback
      const base = (period === 'mtd')
        ? aggregateByDate(rows, dateCol, valueCol)
        : aggregateByMonth(rows, dateCol, valueCol);
      currentRows = base.map(r => ({ label: r.label, TotalSales: parseFloat(r.value) || 0 }));
    }

    /* Merge prior-year sales as "PY_TotalSales" — match by calendar period key, not row index */
    currentRows = aggregateTrendChartRows(currentRows);

    if (pyTrendRows?.length && currentRows.length) {
      const pySeries = extractTrendSeries(pyTrendRows);
      const pyByKey = new Map();
      for (const p of pySeries) {
        const k = canonicalTrendLabelKey(p.label);
        if (!k) continue;
        pyByKey.set(k, (pyByKey.get(k) || 0) + p.value);
      }
      return currentRows.map((r) => {
        const ck = canonicalTrendLabelKey(r.label);
        const pyK = priorYearTrendKey(ck);
        let pyVal = null;
        if (pyK != null && pyByKey.has(pyK)) pyVal = pyByKey.get(pyK);
        return { ...r, PY_TotalSales: pyVal != null ? pyVal : null };
      });
    }
    return currentRows;
  }, [trendAiRows, pyTrendRows, rows, valueCol, dateCol, period]);

  /* Build department chart rows from analytics dashboard rows. */
  const deptChartRows = useMemo(() => {
    if (!deptAiRows?.length) return [];
    const labelCol = pickAILabelCol(deptAiRows, 'dept');
    const valCol   = pickAIValueCol(deptAiRows);
    return deptAiRows
      .map(r => ({ label: String(r[labelCol] ?? ''), _v: parseFloat(r[valCol]) || 0 }))
      .filter(r => r.label && !isJunkGroupKey(r.label) && r._v > 0)
      .sort((a, b) => b._v - a._v)
      .slice(0, 20)
      .map(r => ({ label: r.label, SaleNetAmount: r._v }));
  }, [deptAiRows]);

  /* Build category chart rows from analytics dashboard rows. */
  const catChartRows = useMemo(() => {
    if (!catAiRows?.length) return [];
    const labelCol = pickAILabelCol(catAiRows, 'cat');
    const valCol   = pickAIValueCol(catAiRows);
    return catAiRows
      .map(r => ({ label: String(r[labelCol] ?? ''), _v: parseFloat(r[valCol]) || 0 }))
      .filter(r => r.label && !isJunkGroupKey(r.label) && r._v > 0)
      .sort((a, b) => b._v - a._v)
      .slice(0, 20)
      .map(r => ({ label: r.label, SaleNetAmount: r._v }));
  }, [catAiRows]);

  const hasAnyData = branchChartRows.length > 0 || deptChartRows.length > 0 || catChartRows.length > 0 || trendChartRows.length > 0;

  return (
    <div className="card p-5 space-y-4 fade-in">
      {/* Header */}
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div>
          <h3 className="font-bold text-base" style={{color:'var(--text-strong)'}}>📈 Sales Analytics</h3>
          <p className="text-xs mt-0.5" style={{color:'var(--text-muted)'}}>
            {from} → {to}{txCount ? ` · ${txCount}` : ''}
          </p>
        </div>
        <div style={{textAlign:'right'}}>
          <div className="font-extrabold text-xl" style={{color:'var(--brand)'}}>
            {fmtRupee(total)}
          </div>
          <div className="text-xs" style={{color:'var(--text-muted)'}}>{periodLabel} — ₹ Net Sales</div>
          {pyKpiTotal !== null && pyKpiTotal > 0 && (
            <div className="text-xs mt-0.5" style={{color: total >= pyKpiTotal ? '#10b981' : '#ef4444', fontWeight:600}}>
              {total >= pyKpiTotal ? '▲' : '▼'} vs LY: {fmtRupee(pyKpiTotal)}
              {' '}({total > 0 ? ((((total - pyKpiTotal) / pyKpiTotal) * 100)).toFixed(1) : '0'}%)
            </div>
          )}
        </div>
      </div>

      {/* Period tabs */}
      <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
        {PERIODS.map(({ key, label }) => (
          <button key={key} style={pill(period === key)} onClick={() => handlePeriod(key)}>
            {label}
          </button>
        ))}
      </div>

      {error && <Alert type="error" msg={error} onClose={() => setError('')} />}

      {loading && (
        <div className="flex items-center gap-2 py-4" style={{color:'var(--text-muted)'}}>
          <Spinner size={16}/>
          <span className="text-sm">Loading {periodLabel} analytics (branch + dept ✨ + category ✨)…</span>
        </div>
      )}

      {/* Today's KPI summary box (shown instead of trend chart for 'today') */}
      {!loading && period === 'today' && kpiTotal > 0 && (
        <div style={{
          display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(120px,1fr))', gap:12, marginTop:4
        }}>
          {[
            { icon:'💰', val: fmtRupee(kpiTotal),      lbl: "Today's Sales",       color:'#6366f1' },
            { icon:'🧾', val: kpiTxCount.toLocaleString('en-IN'), lbl: 'Bills (Invoices)',    color:'#10b981' },
            ...(pyKpiTotal ? [{ icon:'📅', val: fmtRupee(pyKpiTotal), lbl: 'Last Year (Same Day)', color:'#f59e0b' }] : []),
          ].map((t,i) => (
            <div key={i} style={{
              background:'var(--surface2)', borderRadius:12, padding:'12px 14px',
              border:'1px solid var(--border)', textAlign:'center',
            }}>
              <div style={{fontSize:20}}>{t.icon}</div>
              <div style={{fontSize:18, fontWeight:800, color:t.color, marginTop:4}}>{t.val}</div>
              <div style={{fontSize:11, color:'var(--text-muted)', marginTop:2}}>{t.lbl}</div>
            </div>
          ))}
        </div>
      )}

      {!loading && hasAnyData && (
        <div className="space-y-5">
          {/* Trend chart — show for non-Today periods (dual series: TotalSales + PY_TotalSales + InvoiceCount) */}
          {period !== 'today' && trendChartRows.length > 0 && (
            <div className="chart-wrapper">
              <ChartWithToggle
                rows={trendChartRows}
                labelCol="label"
                valueCols={[
                  'TotalSales',
                  ...(trendChartRows[0]?.PY_TotalSales != null ? ['PY_TotalSales'] : []),
                  ...(trendChartRows[0]?.InvoiceCount != null ? ['InvoiceCount'] : []),
                ]}
                title={
                  period === 'mtd'
                    ? '📅 MTD — Day-wise Sales (Current vs Last Year)'
                    : period === 'qtd'
                      ? '📅 QTD — Month-wise Sales (Current vs Last Year)'
                      : period === 'ytd'
                        ? '📅 YTD — Month-wise Sales (Current vs Last Year)'
                        : '📅 Last 6M — Month-wise Sales (Current vs Last Year)'
                }
                icon=""
                defaultChartType="bar"
              />
            </div>
          )}

          {/* Branch chart */}
          {branchChartRows.length > 0 && (
            <div className="chart-wrapper">
              <ChartWithToggle
                rows={branchChartRows}
                labelCol="label"
                valueCols={[displayValueCol]}
                title="Sales by Branch"
                icon="🏬"
              />
            </div>
          )}

          {/* Department chart (AI) */}
          {deptChartRows.length > 0 && (
            <div className="chart-wrapper">
              <ChartWithToggle
                rows={deptChartRows}
                labelCol="label"
                valueCols={['SaleNetAmount']}
                title="Sales by Department ✨"
                icon="🏢"
              />
            </div>
          )}

          {/* Category chart (AI) */}
          {catChartRows.length > 0 && (
            <div className="chart-wrapper">
              <ChartWithToggle
                rows={catChartRows}
                labelCol="label"
                valueCols={['SaleNetAmount']}
                title="Sales by Category ✨"
                icon="🏷️"
              />
            </div>
          )}
        </div>
      )}

      {!loading && !hasAnyData && (
        <p className="text-sm py-4 text-center" style={{color:'var(--text-muted)'}}>
          No sales data found for {periodLabel} ({from} → {to})
        </p>
      )}
    </div>
  );
}

function HomePanel({ auth, onNavigate }) {

  const [mtdKpi,    setMtdKpi]    = useState(null);

  const [mtdKpiStatus, setMtdKpiStatus]     = useState('loading');
  const [kpiErr,    setKpiErr]    = useState(false);
  const history = useMemo(() => { try { return JSON.parse(localStorage.getItem("erp_ai_history") || "[]"); } catch { return []; } }, []);
  const { mobile } = useBreakpoint();

  useEffect(() => {
    apiFetch("/api/connector-config", { token: auth.token })
      .then(d => setConnectorConfig(d))
      .catch(() => {});
  }, [auth.token]);

  const features = auth.features || [];

  /* Fetch today + MTD KPIs for the home page summary tiles — independent calls so one
     failure/timeout doesn't block the other tile from rendering.                      */
  useEffect(() => {
    if (!features.includes('data')) return;
    const mkOpts = (period) => ({
      method: 'POST', token: auth.token,
      timeoutMs: ERP_ANALYTICS_TIMEOUT_MS,
      body: { period, dataset: 'sales', compact: true },
    });
    setTodayKpiStatus('loading');
    setMtdKpiStatus('loading');

          setTodayKpiStatus('error');

        setTodayKpi(null);
        setTodayKpiStatus('error');
      });
    apiFetch('/api/analytics/dashboard', mkOpts('mtd'))
      .then(d => {
        if (d && d.kpi) {
          setMtdKpi(d.kpi);
          setMtdKpiStatus('ok');
        } else {
          setMtdKpi(null);
          setMtdKpiStatus('error');

      .catch(() => {
        setMtdKpi(null);
        setMtdKpiStatus('error');

                  border: "none",

            {auth.role==="admin"?"👑":auth.role==="manager"?"📋":"👁"}

          <span style={{marginLeft:"auto",fontSize:11,fontWeight:700,padding:"3px 12px",borderRadius:20,background:roleBg,color:roleText}}>{auth.role}</span>
        </div>

        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {features.map(f => (
            <span key={f} style={{fontSize:11,padding:"3px 12px",borderRadius:20,background:"#eef2ff",color:"#4f46e5",fontWeight:600,border:"1px solid #c7d2fe"}}>{f}</span>
          ))}
        </div>
      </div>
    </div>
  );
}

              <span className="flex-shrink-0 mt-0.5">⚠️</span>

function ChangePasswordModal({ auth, onClose }) {
  const [cur, setCur]   = useState("");
  const [nw, setNw]     = useState("");
  const [nw2, setNw2]   = useState("");
  const [loading, setLoading] = useState(false);
  const [msg, setMsg]   = useState(null);

  async function submit(e) {
    e.preventDefault();
    if (nw !== nw2) { setMsg({ type: "error", text: "New passwords do not match." }); return; }
    if (nw.length < 8) { setMsg({ type: "error", text: "Password must be at least 8 characters." }); return; }
    setLoading(true); setMsg(null);
    try {
      await apiFetch("/api/auth/change-password", { method: "POST", token: auth.token, body: { currentPassword: cur, newPassword: nw } });
      setMsg({ type: "ok", text: "Password changed! Please log in again." });
      setTimeout(onClose, 2000);
    } catch (err) { setMsg({ type: "error", text: err.message }); }
    finally { setLoading(false); }
  }

  return (
    <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
      <div className="card w-full max-w-sm p-6 fade-in">
        <h2 className="font-bold text-base mb-1 text-slate-800">Change Password</h2>
        <p className="text-xs text-slate-400 mb-5">Update your account password.</p>
        <form onSubmit={submit} className="space-y-3">
          {[["Current password", cur, setCur], ["New password", nw, setNw], ["Confirm new password", nw2, setNw2]].map(([label, val, set]) => (
            <div key={label}>
              <label className="block text-xs font-semibold text-slate-500 mb-1">{label}</label>
              <input type="password" value={val} onChange={e => set(e.target.value)} required className="input-base" />
            </div>
          ))}
          {msg && <Alert type={msg.type} msg={msg.text} />}
          <div className="flex gap-2 pt-1">
            <button type="submit" disabled={loading} className="btn-primary flex-1 justify-center">
              {loading ? <><Spinner size={14} color="white"/>Saving…</> : "Change password"}
            </button>
            <button type="button" onClick={onClose} className="btn-ghost flex-1">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function ExplorerPanel({ auth, onAskAI }) {

  const [filter, setFilter]     = useState("");

  const [loading, setLoading]   = useState(false);
  const [err, setErr]           = useState("");
  const [preview, setPreview]   = useState({ key: null, data: null, loading: false });

  useEffect(() => {
    setLoading(true);
    apiFetch("/api/schema/objects", { token: auth.token })
      .then(d => setObjects(d)).catch(e => setErr(e.message)).finally(() => setLoading(false));
  }, []);

  async function toggleObj(schema, name) {
    const key = `${schema}.${name}`;
    setExpanded(prev => ({ ...prev, [key]: !prev[key] }));
    if (!cols[key]) {
      try {
        const data = await apiFetch(`/api/schema/columns/${encodeURIComponent(schema)}/${encodeURIComponent(name)}`, { token: auth.token });
        setCols(prev => ({ ...prev, [key]: data }));
      } catch { setCols(prev => ({ ...prev, [key]: [] })); }
    }
  }

  async function loadPreview(schema, name) {
    const key = `${schema}.${name}`;
    setPreview({ key, data: null, loading: true });
    try {
      const data = await apiFetch(`/api/schema/preview/${encodeURIComponent(schema)}/${encodeURIComponent(name)}?limit=15`, { token: auth.token });
      setPreview({ key, data, loading: false });
    } catch { setPreview({ key, data: [], loading: false }); }
  }

  function dtBadgeClass(dt) {
    const d = (dt || "").toLowerCase();
    if (/int|decimal|numeric|float|real|money/.test(d)) return "explorer-type-pill is-num";
    if (/date|time/.test(d)) return "explorer-type-pill is-date";
    if (/char|varchar|text|nchar|nvarchar/.test(d)) return "explorer-type-pill is-text";
    return "explorer-type-pill is-other";
  }

  const q = filter.toLowerCase();
  const views  = (objects?.views  || []).filter(o => !q || o.name.toLowerCase().includes(q));
  const tables = (objects?.tables || []).filter(o => !q || o.name.toLowerCase().includes(q));

  return (
    <div className="space-y-5">
      <div>
        <h2 className="text-xl font-bold text-slate-800">Database Explorer</h2>
        <p className="text-sm text-slate-500 mt-0.5">Browse tables and views in your ERP database.</p>
      </div>

      <div className="flex flex-col gap-2 sm:flex-row">
        <input value={filter} onChange={e => setFilter(e.target.value)} placeholder="Search tables & views…" className="input-base flex-1" />
        <div className="flex gap-2">
          {["all","views","tables"].map(t => (
            <button key={t} onClick={() => setType(t)}
              className={`flex-1 sm:flex-none px-4 py-2 rounded-xl text-xs font-semibold transition-all ${typeFilter === t ? "btn-primary" : "btn-ghost"}`}>
              {t[0].toUpperCase() + t.slice(1)}
            </button>
          ))}
        </div>
      </div>

      {loading && <div className="flex items-center gap-2.5 text-slate-400 text-sm"><Spinner/>Loading schema…</div>}
      {err && <Alert type="error" msg={err} />}

      {objects && (
        <div className="space-y-5">
          {typeFilter !== "tables" && views.length > 0 && (
            <div>
              <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">📋 Views ({views.length})</p>
              {views.map(v => <ObjectCard key={`${v.schema}.${v.name}`} obj={v} type="VIEW" auth={auth} cols={cols} expanded={expanded} onToggle={toggleObj} onPreview={loadPreview} onAskAI={onAskAI} dtBadgeClass={dtBadgeClass} />)}
            </div>
          )}
          {typeFilter !== "views" && tables.length > 0 && (
            <div>
              <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">🗂 Tables ({tables.length})</p>
              {tables.map(t => <ObjectCard key={`${t.schema}.${t.name}`} obj={t} type="TABLE" auth={auth} cols={cols} expanded={expanded} onToggle={toggleObj} onPreview={loadPreview} onAskAI={onAskAI} dtBadgeClass={dtBadgeClass} />)}
            </div>
          )}
        </div>
      )}

      {preview.key && (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 backdrop-blur-sm" onClick={() => setPreview({ key:null, data:null, loading:false })}>
          <div className="card w-full max-w-5xl p-6 fade-in max-h-[80vh] overflow-auto" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-bold text-base text-slate-800">Preview: {preview.key}</h3>
              <button onClick={() => setPreview({ key:null, data:null, loading:false })} className="text-slate-400 hover:text-slate-700 text-xl">✕</button>
            </div>
            {preview.loading
              ? <div className="flex items-center gap-2.5 text-slate-400 py-6"><Spinner/>Loading…</div>
              : <>
                  <DataTable rows={preview.data} maxHeight="420px" />

                </>

  );

/* ═══════════════════════════════════════════════
   ANALYTICS ENGINE — cached aggregates, cross-filter, adaptive charts
═══════════════════════════════════════════════ */
const ANALYTICS_PERIOD_CHIPS = [
  { key: "mtd", label: "MTD" },
  { key: "qtd", label: "QTD" },
  { key: "ytd", label: "YTD" },
  { key: "last_30d", label: "30d" },
  { key: "last_90d", label: "90d" },
  { key: "6m", label: "Last 6M" },
  { key: "last_180d", label: "180d" },
  { key: "custom", label: "Custom" },
];

/** flex `order` values — personalize dashboard block sequence */
const ANALYTICS_LAYOUT_PRESETS = {
  default: { meta: 0, kpi: 10, trend: 20, split: 30, cat: 40, table: 50 },
  trend_first: { meta: 0, kpi: 20, trend: 10, split: 30, cat: 40, table: 50 },
  breakdown_first: { meta: 0, kpi: 10, split: 20, trend: 30, cat: 40, table: 50 },
};

/** Default MTD critical payload — warmed via idle prefetch + Analytics nav hover. */
const analyticsPrefetchStore = {
  criticalHit: null,
};

function mergeAnalyticsDashboard(critical, widgetsPatch) {
  if (!critical) return widgetsPatch;
  if (!widgetsPatch || widgetsPatch.loadPhase !== "widgets") return critical;
  const a = critical.vizHints || {};
  const b = widgetsPatch.vizHints || {};
  const yMax =
    a.yAxisMoneyMax != null && b.yAxisMoneyMax != null
      ? Math.max(a.yAxisMoneyMax, b.yAxisMoneyMax)
      : b.yAxisMoneyMax != null
        ? b.yAxisMoneyMax
        : a.yAxisMoneyMax;
  const next = {
    ...critical,
    widgets: {
      ...(critical.widgets || {}),
      ...(widgetsPatch.widgets || {}),
    },
    vizHints: {
      ...a,
      ...b,
      ...(yMax != null ? { yAxisMoneyMax: yMax } : {}),
    },
    insights: Array.isArray(widgetsPatch.insights) ? widgetsPatch.insights : critical.insights,
    insightsMeta: widgetsPatch.insightsMeta != null ? widgetsPatch.insightsMeta : critical.insightsMeta,
    computedAt: widgetsPatch.computedAt || critical.computedAt,
    cacheHit: Boolean(critical.cacheHit && widgetsPatch.cacheHit),
    cacheLayer: [critical.cacheLayer, widgetsPatch.cacheLayer].filter(Boolean).join("+") || critical.cacheLayer,
  };
  if (next.loadPhase === "critical") delete next.loadPhase;
  return next;
}

function prefetchAnalyticsCriticalDefault(token) {
  if (!token) return;
  const body = { period: "mtd", dataset: "sales", loadPhase: "critical", compact: true };
  const key = JSON.stringify(body);
  const prev = analyticsPrefetchStore.criticalHit;
  if (prev && prev.key === key && Date.now() - prev.ts < 60_000) return;
  apiFetch("/api/analytics/dashboard", { method: "POST", token, body, timeoutMs: ERP_ANALYTICS_TIMEOUT_MS })
    .then((data) => {
      analyticsPrefetchStore.criticalHit = { key, data, ts: Date.now() };
    })
    .catch(() => {});
}

function AnalyticsPanel({ auth }) {
  const [period, setPeriod] = useState("mtd");
  const [fy, setFy] = useState("");
  const [customFrom, setCustomFrom] = useState("");
  const [customTo, setCustomTo] = useState("");
  const [crossFilter, setCrossFilter] = useState({});
  const [trendMonth, setTrendMonth] = useState("");
  const [forceGranularity, setForceGranularity] = useState("auto");
  const [data, setData] = useState(null);
  const [loadingCritical, setLoadingCritical] = useState(false);
  const [loadingWidgets, setLoadingWidgets] = useState(false);
  const [loadingMessage, setLoadingMessage] = useState("");
  const loadSeqRef = React.useRef(0);
  const [err, setErr] = useState("");
  const [viewName, setViewName] = useState("");
  const [drillOpen, setDrillOpen] = useState(false);
  const [drillLoading, setDrillLoading] = useState(false);
  const [drillRows, setDrillRows] = useState([]);
  const [virtScroll, setVirtScroll] = useState(0);
  const [branchVirt, setBranchVirt] = useState(0);
  const versionRef = React.useRef(0);
  const pollBootRef = React.useRef(false);

  const [layoutPreset, setLayoutPreset] = useState(() => {
    try {
      return localStorage.getItem("erp_analytics_layout_preset") || "default";
    } catch {
      return "default";
    }
  });
  useEffect(() => {
    try {
      localStorage.setItem("erp_analytics_layout_preset", layoutPreset);
    } catch {}
  }, [layoutPreset]);
  const layoutOrd = ANALYTICS_LAYOUT_PRESETS[layoutPreset] || ANALYTICS_LAYOUT_PRESETS.default;
  const ROW_H = 28;

  const [savedViews, setSavedViews] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem("erp_analytics_views") || "[]");
    } catch {
      return [];
    }
  });

  const dims = data && data.dimensions;
  const branchCol = dims && dims.branchColumn;
  const deptCol = dims && dims.departmentColumn;
  const catCol = dims && dims.categoryColumn;
  const selectedPeriodLabel =
    (ANALYTICS_PERIOD_CHIPS.find((p) => p.key === period) || {}).label || String(period || "").toUpperCase();
  const isLoadingAny = loadingCritical || loadingWidgets;

  const load = React.useCallback(async () => {
    const seq = ++loadSeqRef.current;
    setLoadingCritical(true);
    setLoadingWidgets(true);
    setLoadingMessage(`Fetching ${selectedPeriodLabel} KPIs and trend…`);
    setErr("");
    const bodyBase = { period, crossFilter, dataset: "sales", compact: true };
    if (fy.trim()) bodyBase.fy = fy.trim();
    if (period === "custom") bodyBase.custom = { from: customFrom, to: customTo };
    if (trendMonth && /^\d{4}-\d{2}$/.test(trendMonth.trim())) bodyBase.trendMonth = trendMonth.trim();
    if (forceGranularity === "day") bodyBase.forceTrendGranularity = "day";
    if (forceGranularity === "month") bodyBase.forceTrendGranularity = "month";

    const analyticsTimeout = ERP_ANALYTICS_TIMEOUT_MS;
    try {
      const prefetchKey = JSON.stringify({ ...bodyBase, loadPhase: "critical" });
      let critical;
      const hit = analyticsPrefetchStore.criticalHit;
      if (hit && hit.key === prefetchKey && Date.now() - hit.ts < 90_000) {
        critical = hit.data;
        analyticsPrefetchStore.criticalHit = null;
      } else {
        critical = await apiFetch("/api/analytics/dashboard", {
          method: "POST",
          token: auth.token,
          timeoutMs: analyticsTimeout,
          body: { ...bodyBase, loadPhase: "critical" },
        });
      }
      if (seq !== loadSeqRef.current) return;
      setData(critical);
      setLoadingCritical(false);
      setLoadingMessage(`Fetching ${selectedPeriodLabel} breakdowns and insights…`);

      const mergedDvBase = critical && critical.dataVersion;
      if (mergedDvBase != null) {
        versionRef.current = mergedDvBase;
        pollBootRef.current = true;
      }

      try {
        const widgetsPatch = await apiFetch("/api/analytics/dashboard", {
          method: "POST",
          token: auth.token,
          timeoutMs: analyticsTimeout,
          body: { ...bodyBase, loadPhase: "widgets" },
        });
        if (seq !== loadSeqRef.current) return;
        setData((prev) => mergeAnalyticsDashboard(prev, widgetsPatch));
        const mergedDv = widgetsPatch && widgetsPatch.dataVersion;
        if (mergedDv != null) {
          versionRef.current = mergedDv;
        }
      } catch (wErr) {
        if (seq !== loadSeqRef.current) return;
        setErr((wErr && wErr.message) || String(wErr));
      } finally {
        if (seq === loadSeqRef.current) {
          setLoadingWidgets(false);
          setLoadingMessage("");
        }
      }
    } catch (e) {
      if (seq !== loadSeqRef.current) return;
      setErr(e.message || String(e));
      setData(null);
      setLoadingCritical(false);
      setLoadingWidgets(false);
      setLoadingMessage("");
    }
  }, [auth.token, period, fy, customFrom, customTo, crossFilter, trendMonth, forceGranularity, selectedPeriodLabel]);

  useEffect(() => {
    if (period === "custom" && (!customFrom || !customTo)) return;
    load();
  }, [load, period, customFrom, customTo, crossFilter, fy, trendMonth, forceGranularity]);

  useEffect(() => {
    const base = getApiBase();
    const k = getApiKey();
    const tok = auth && auth.token;
    const params = new URLSearchParams();
    if (tok) params.set("access_token", tok);
    if (k) params.set("api_key", k);
    const qs = params.toString();
    const url = `${base}/api/analytics/events${qs ? `?${qs}` : ""}`;
    let es;
    try {
      es = new EventSource(url);
      es.onmessage = (ev) => {
        try {
          const d = JSON.parse(ev.data);
          const dv = d.dataVersion;
          if (dv == null || !pollBootRef.current) return;
          if (dv !== versionRef.current) {
            versionRef.current = dv;
            load();
          }
        } catch (_) {}
      };
    } catch (_) {}

    const id = setInterval(async () => {
      try {
        if (!pollBootRef.current) return;
        const v = await apiFetch("/api/analytics/version", { token: auth.token });
        const dv = v && v.dataVersion;
        if (dv != null && dv !== versionRef.current) {
          versionRef.current = dv;
          load();
        }
      } catch {}
    }, 60000);
    return () => {
      clearInterval(id);
      try {
        if (es) es.close();
      } catch (_) {}
    };
  }, [auth.token, load]);

  function toggleCross(dimSqlCol, label) {
    if (!dimSqlCol) return;
    const v = String(label || "").trim();
    if (!v) return;
    setCrossFilter((prev) => {
      const next = { ...prev };
      if (next[dimSqlCol] === v) delete next[dimSqlCol];
      else next[dimSqlCol] = v;
      return next;
    });
  }

  function saveView() {
    const name = (viewName || "Saved view").trim();
    const entry = {
      name,
      period,
      fy: fy || "",
      customFrom,
      customTo,
      crossFilter,
      trendMonth: trendMonth || "",
      forceGranularity: forceGranularity || "auto",
      layoutPreset: layoutPreset || "default",
      at: Date.now(),
    };
    const next = [entry, ...savedViews.filter((x) => x.name !== name)].slice(0, 12);
    setSavedViews(next);
    try {
      localStorage.setItem("erp_analytics_views", JSON.stringify(next));
    } catch {}
  }

  function applySaved(i) {
    const v = savedViews[i];
    if (!v) return;
    setPeriod(v.period || "mtd");
    setFy(v.fy || "");
    setCustomFrom(v.customFrom || "");
    setCustomTo(v.customTo || "");
    setTrendMonth(v.trendMonth || "");
    setForceGranularity(v.forceGranularity || "auto");
    setLayoutPreset(v.layoutPreset || "default");
    setCrossFilter(v.crossFilter && typeof v.crossFilter === "object" ? { ...v.crossFilter } : {});
    setViewName(v.name || "");
  }

  async function openDrillthrough() {
    if (!data || !data.period) return;
    setDrillLoading(true);
    setErr("");
    try {
      const body = {
        dataset: "sales",
        from: data.period.from,
        to: data.period.to,
        crossFilter,
        limit: 400,
      };
      const r = await apiFetch("/api/analytics/drillthrough", {
        method: "POST",
        token: auth.token,
        body,
      });
      setDrillRows(Array.isArray(r.data) ? r.data : []);
      setVirtScroll(0);
      setDrillOpen(true);
    } catch (e) {
      setErr(e.message || String(e));
    } finally {
      setDrillLoading(false);
    }
  }

  const kpi = data && data.kpi;
  const wB = data && data.widgets && data.widgets.byBranch;
  const wD = data && data.widgets && data.widgets.byDepartment;
  const wC = data && data.widgets && data.widgets.byCategory;
  const wT = data && data.widgets && data.widgets.byTrend;

  const branchChartRows = (wB && wB.rows ? wB.rows : []).map((r) => ({
    label: r.label,
    SaleNetAmount: r.metric_value,
  }));
  const deptChartRows = (wD && wD.rows ? wD.rows : []).map((r) => ({
    label: r.label,
    SaleNetAmount: r.metric_value,
  }));
  const catChartRows = (wC && wC.rows ? wC.rows : []).map((r) => ({
    label: r.label,
    SaleNetAmount: r.metric_value,
  }));
  const trendRows = (wT && wT.rows ? wT.rows : []).map((r) => ({
    period_label: r.period_label,
    SaleNetAmount: r.metric_value,
    txn_count: r.txn_count,
  }));

  function barClickFactory(rows, dimKey) {
    return (params) => {
      const idx = params && params.dataIndex;
      if (idx == null || !rows[idx]) return;
      toggleCross(dimKey, rows[idx].label);
    };
  }

  function onTrendPointClick(params) {
    const idx = params && params.dataIndex;
    if (idx == null || !wT || !wT.rows || !wT.rows[idx]) return;
    const pl = String(wT.rows[idx].period_label || "");
    if (wT.granularity === "month" && /^\d{4}-\d{2}/.test(pl)) {
      setTrendMonth(pl.slice(0, 7));
    }
  }

  const qual = data && data.quality;

  return (
    <div className="space-y-5">
      <div>
        <h2 className="text-xl font-bold text-slate-800">📈 Analytics Engine</h2>
        <p className="text-sm text-slate-500 mt-0.5">
          Server-side rollups with cache, checksums, and cross-filtering (same column names as your SQL view).
        </p>
      </div>

      {data && Array.isArray(data.insights) && data.insights.length > 0 && (
        <div
          className="card p-4 border-l-4"
          style={{
            borderLeftColor: "var(--chart-axis-active, #7c3aed)",
            background: "var(--bg-muted, rgba(124,58,237,.06))",
          }}
        >
          <h3 className="text-sm font-bold text-slate-700 mb-2 flex items-center gap-2">
            <span aria-hidden>💡</span> Automatic insights
            <span className="text-[10px] font-normal uppercase tracking-wide text-slate-500">
              data-derived · not generative
            </span>
          </h3>
          <ul className="space-y-3 text-sm text-slate-700">
            {data.insights.map((ins) => (
              <li key={ins.id} className="leading-snug">
                <span className="font-semibold text-slate-800">{ins.title}</span>
                {ins.detail && (
                  <p className="text-xs text-slate-600 mt-0.5">{ins.detail}</p>
                )}
                {(ins.caveats && ins.caveats.length > 0) || ins.confidence === "low" ? (
                  <p className="text-[11px] text-amber-800/90 mt-1 italic">
                    {ins.confidence === "low" ? "Low confidence — " : ""}
                    {(ins.caveats || []).join(" ")}
                  </p>
                ) : null}
              </li>
            ))}
          </ul>
          {data.insightsMeta && data.insightsMeta.priorFrom && (
            <p className="text-[10px] text-slate-500 mt-3 font-mono">

            </p>

        </div>

      <div className="card p-4 flex flex-wrap gap-2 items-center">
        {ANALYTICS_PERIOD_CHIPS.map((p) => (
          <button
            key={p.key}
            type="button"
            onClick={() => setPeriod(p.key)}
            className={`chip ${period === p.key ? "ring-2 ring-indigo-400 bg-indigo-50" : ""}`}

        {period === "custom" && (

              type="date"
              value={customFrom}
              onChange={(e) => setCustomFrom(e.target.value)}

            <span className="text-xs text-slate-500">to</span>
            <input
              type="date"
              value={customTo}
              onChange={(e) => setCustomTo(e.target.value)}
              className="input-base text-xs w-auto"

            </button>
          </div>
        )}
        <button
          type="button"
          onClick={() => load()}
          disabled={isLoadingAny}
          className="btn-ghost text-xs py-1.5 ml-auto"
        >
          {isLoadingAny ? `⏳ Loading ${selectedPeriodLabel}…` : `↻ Load ${selectedPeriodLabel}`}
        </button>
      </div>

      {isLoadingAny && (
        <div className="card p-3 space-y-2">
          <div className="flex items-center gap-2 text-xs text-slate-500">
            <Spinner size={14} />
            <span>{loadingMessage || "Loading analytics…"}</span>
          </div>
          <div className="h-1.5 rounded-full bg-slate-200/70 overflow-hidden">
            <div
              className="h-full rounded-full transition-all duration-300"
              style={{
                width: loadingCritical ? "45%" : "90%",

            Clear all

      <div className="card p-4 space-y-2">
        <p className="text-xs font-semibold text-slate-600">Saved views (browser)</p>
        <div className="flex flex-wrap gap-2 items-center">
          <input
            value={viewName}
            onChange={(e) => setViewName(e.target.value)}
            placeholder="View name"
            className="input-base text-xs max-w-[200px]"

          <button type="button" onClick={saveView} className="btn-primary text-xs py-1.5 px-3">
            Save
          </button>
          {savedViews.length > 0 && (
            <select
              className="input-base text-xs max-w-[240px]"
              onChange={(e) => {
                const i = parseInt(e.target.value, 10);
                if (!Number.isNaN(i)) applySaved(i);
                e.target.value = "";
              }}
              defaultValue=""
            >
              <option value="" disabled>
                Load saved…
              </option>
              {savedViews.map((v, i) => (
                <option key={i} value={i}>
                  {v.name} · {v.period}
                </option>
              ))}
            </select>
          )}
        </div>
      </div>

      {loadingCritical && !data && (
        <div className="space-y-4 fade-in">
          <AnalyticsKpiSkeleton />
          <AnalyticsChartSkeleton tall />
          <div className="grid-2col gap-4">
            <AnalyticsChartSkeleton />
            <AnalyticsChartSkeleton />
          </div>
          <AnalyticsChartSkeleton />
          <div className="card p-3 flex items-center gap-2 text-xs text-slate-500">
            <Spinner size={14} />
            <span>Loading KPIs and trend…</span>
          </div>
        </div>
      )}
      {err && <Alert type="error" msg={err} onClose={() => setErr("")} />}

      {loadingWidgets && data && (
        <div className="card p-3 flex items-center gap-2 text-xs text-slate-500">
          <Spinner size={14} />
          <span>Loading breakdowns and insights…</span>
        </div>
      )}

      {data && (
        <div className="flex flex-col gap-3 fade-in">
          <div style={{ order: layoutOrd.meta }} className="space-y-2">
          <div className="flex flex-wrap gap-2 text-[11px] text-slate-500">
            <span>
              v{data.dataVersion} {data.cacheHit ? "· cached" : "· fresh"}
              {data.cacheLayer && (
                <span>
                  {" "}
                  · {String(data.cacheLayer)}
                </span>
              )}
            </span>
            <span>
              ·{" "}
              {loadingCritical
                ? `${String(period || "").toUpperCase()} · updating…`
                : data.period && data.period.preset
                  ? String(data.period.preset).toUpperCase()
                  : String(period || "").toUpperCase()}
            </span>
            {data.period && data.period.fyLabel && <span>· {data.period.fyLabel}</span>}
            <span>
              ·{" "}
              {loadingCritical
                ? "… → …"
                : `${data.period && data.period.from ? data.period.from : ""} → ${data.period && data.period.to ? data.period.to : ""}`}
            </span>
            <span>· computed {data.computedAt && new Date(data.computedAt).toLocaleString()}</span>
            <span>
              · SSE + 60s backup · Σ {data && data.compositeFingerprint ? data.compositeFingerprint.slice(0, 10) : "—"}
            </span>
          </div>
          {data.period && data.period.fyContextNote && (
            <p className="text-[11px] text-amber-900/90 bg-amber-50 border border-amber-200 rounded px-2 py-1.5 leading-snug max-w-3xl">
              {data.period.fyContextNote}
            </p>
          )}
          {qual && qual.sourceSync && (
            <p className="text-[11px] text-slate-500">
              Source window: latest txn date {qual.sourceSync.rangeMaxDate || "—"}
              {qual.sourceSync.watermarkMax && (
                <>
                  {" "}
                  · ETL watermark ({qual.sourceSync.watermarkColumn || "?"}): {qual.sourceSync.watermarkMax}
                </>
              )}
              {qual.sourceSync.trendVsKpiSkipped
                ? " · trend vs KPI check skipped (month drill)"
                : qual.sourceSync.kpiTrendAligned === false
                  ? " · trend sum vs KPI mismatch (see warnings)"
                  : " · trend Σ vs KPI OK"}
            </p>
          )}
          {data.vizHints && data.vizHints.yAxisMoneyMax != null && (
            <p className="text-[11px] text-slate-500">
              Shared scale cap (₹ raw): {formatCompactNumber(data.vizHints.yAxisMoneyMax)} — branch {wB && wB.checksum ? wB.checksum.slice(0, 8) : "—"} · trend{" "}
              {wT && wT.checksum ? wT.checksum.slice(0, 8) : "—"}
            </p>
          )}

          {qual && qual.reconciliation && (qual.reconciliation.mismatch || qual.reconciliation.error) && (
            <div
              className={
                qual.reconciliation.error
                  ? "rounded-xl border border-red-300 bg-red-50 px-3 py-2 text-xs text-red-900"
                  : "rounded-xl border border-rose-300 bg-rose-50 px-3 py-2 text-xs text-rose-900"
              }
            >
              <span className="font-semibold">
                {qual.reconciliation.error ? "Reconciliation error" : "Data reconciliation mismatch"}
              </span>
              <p className="mt-1">
                {qual.reconciliation.error
                  ? qual.reconciliation.message || "Source verification query failed."
                  : qual.reconciliation.sourceTable &&
                      qual.reconciliation.dashboardTable &&
                      qual.reconciliation.source &&
                      qual.reconciliation.dashboard
                    ? `Line-level ${qual.reconciliation.sourceTable} vs dashboard ${qual.reconciliation.dashboardTable}: ` +
                      `Σ sales source ₹${Number(qual.reconciliation.source.totalSales || 0).toLocaleString("en-IN", { maximumFractionDigits: 0 })} vs ` +
                      `dashboard ₹${Number(qual.reconciliation.dashboard.totalSales || 0).toLocaleString("en-IN", { maximumFractionDigits: 0 })} · ` +
                      `rows ${qual.reconciliation.source.txnCount} vs ${qual.reconciliation.dashboard.txnCount}.`
                    : `Reported in quality.reconciliation — inspect API payload.`}
              </p>
              {qual.reconciliation.drift && (
                <p className="mt-1 text-[11px] opacity-90">
                  Drift (money % / txn): {(qual.reconciliation.drift.moneyPct * 100).toFixed(4)}% · txn Δ{" "}
                  {qual.reconciliation.drift.txnAbs}
                </p>
              )}
            </div>
          )}

          {qual && qual.warnings && qual.warnings.length > 0 && (
            <div className="rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-xs text-amber-900">
              <span className="font-semibold">Quality checks</span>
              <ul className="list-disc ml-4 mt-1 space-y-0.5">
                {qual.warnings.map((w, i) => (
                  <li key={i}>{typeof w === "string" ? w : w.message || JSON.stringify(w)}</li>
                ))}
              </ul>
            </div>
          )}
          </div>

          <div style={{ order: layoutOrd.kpi }}>
          <div className="grid-stats">
            <div className="kpi-card kpi-blue">
              <span className="kpi-icon">💰</span>
              <div className="kpi-val">{formatCompactNumber((kpi && kpi.totalSales) || 0)}</div>
              <div className="kpi-lbl">Total sales</div>
            </div>
            <div className="kpi-card kpi-emerald">
              <span className="kpi-icon">🧾</span>
              <div className="kpi-val">{(kpi && kpi.txnCount) || 0}</div>
              <div className="kpi-lbl">Transactions</div>
            </div>
            <div className="kpi-card kpi-amber">
              <span className="kpi-icon">📅</span>
              <div className="kpi-val">{(kpi && kpi.activeDays) || 0}</div>
              <div className="kpi-lbl">Active days</div>
            </div>
            <div className="kpi-card kpi-rose">
              <span className="kpi-icon">✓</span>
              <div className="kpi-val" style={{ fontSize: "13px", marginTop: 8, letterSpacing: "-0.5px", wordBreak: "break-all" }}>
                {data && data.compositeFingerprint
                  ? data.compositeFingerprint.slice(0, 10)
                  : (qual && qual.checksumKpi) || "—"}
              </div>
              <div className="kpi-lbl">Checksum (Σ)</div>
            </div>
          </div>
          </div>

          <div style={{ order: layoutOrd.trend }}>
          {wT && trendRows.length > 0 && (
            <div className="card p-4">
              {wT.granularity === "month" && (
                <p className="text-[11px] mb-2" style={{ color: "var(--text-muted)" }}>
                  Click a month to drill daily for that month (sets “Drill trend → month”).
                </p>
              )}
              <MemoLineChart
                rows={trendRows}
                labelCol="period_label"
                valueCols={["SaleNetAmount"]}
                valueAxisMaxRaw={data.vizHints && data.vizHints.yAxisMoneyMax}
                forecast={wT.forecast && wT.forecast.enabled ? wT.forecast : null}
                title={
                  data.trendContext && data.trendContext.drillMonth
                    ? `Sales trend — ${data.trendContext.drillMonth} (daily)`
                    : wT.granularity === "month"
                      ? "Sales trend (monthly buckets)"
                      : "Sales trend (daily buckets)"
                }
                onPointClick={wT.granularity === "month" ? onTrendPointClick : undefined}
              />
              {wT.progressive && wT.progressive.mode === "sampled" && (
                <p className="text-[11px] mt-2" style={{ color: "var(--text-muted)" }}>
                  Progressive rendering: {wT.progressive.sampleSize} points shown (stride {wT.progressive.stride || 1}).
                </p>
              )}
            </div>
          )}
          </div>

          <div style={{ order: layoutOrd.split }} className="grid-2col gap-4">
            {loadingWidgets && branchChartRows.length === 0 && <AnalyticsChartSkeleton />}
            {loadingWidgets && deptChartRows.length === 0 && <AnalyticsChartSkeleton />}
            {branchChartRows.length > 0 &&
              (wB && wB.chartPolicy === "pie" ? (
                <div className="card p-4">
                  <MemoPieChart rows={branchChartRows} labelCol="label" valueCol="SaleNetAmount" title="By branch" />

              ) : (
                <div className="card p-4">
                  <MemoBarChart
                    rows={branchChartRows}
                    labelCol="label"
                    valueCols={["SaleNetAmount"]}
                    title="By branch — click to filter"
                    barOrientation={wB && wB.chartPolicy === "bar_horizontal" ? "horizontal" : "auto"}
                    onPointClick={barClickFactory(branchChartRows, branchCol)}
                    valueAxisMaxRaw={data.vizHints && data.vizHints.yAxisMoneyMax}
                  />
                </div>
              ))}
            {deptChartRows.length > 0 &&
              (wD && wD.chartPolicy === "pie" ? (
                <div className="card p-4">
                  <MemoPieChart rows={deptChartRows} labelCol="label" valueCol="SaleNetAmount" title="By department" />
                </div>
              ) : (
                <div className="card p-4">
                  <MemoBarChart
                    rows={deptChartRows}
                    labelCol="label"
                    valueCols={["SaleNetAmount"]}
                    title="By department — click to filter"
                    barOrientation={wD && wD.chartPolicy === "bar_horizontal" ? "horizontal" : "auto"}
                    onPointClick={barClickFactory(deptChartRows, deptCol)}
                    valueAxisMaxRaw={data.vizHints && data.vizHints.yAxisMoneyMax}
                  />
                </div>
              ))}
          </div>

          <div style={{ order: layoutOrd.cat }}>

                <MemoPieChart rows={catChartRows} labelCol="label" valueCol="SaleNetAmount" title="By category" />

                <MemoBarChart
                  rows={catChartRows}
                  labelCol="label"
                  valueCols={["SaleNetAmount"]}
                  title="By category — click to filter"

                  onPointClick={barClickFactory(catChartRows, catCol)}
                  valueAxisMaxRaw={data.vizHints && data.vizHints.yAxisMoneyMax}
                />

          </div>

          <div style={{ order: layoutOrd.table }}>
          {wB && wB.rows && wB.rows.length > 24 && (() => {
            const br = wB.rows;
            const st = Math.max(0, Math.floor(branchVirt / ROW_H) - 2);
            const SL = 24;
            const sl = br.slice(st, st + SL);
            const topPad = st * ROW_H;
            const botPad = Math.max(0, br.length - st - sl.length) * ROW_H;
            return (
              <div className="card p-3">
                <p className="text-xs font-semibold text-slate-600 mb-2">Branch breakdown (virtualized)</p>
                <div
                  className="table-scroll max-h-52 overflow-y-auto border border-slate-100 rounded-lg"
                  onScroll={(e) => setBranchVirt(e.target.scrollTop)}
                >
                  <table className="data-table text-xs">
                    <thead>
                      <tr>
                        <th>Branch</th>
                        <th className="text-right">Amount</th>
                        <th className="text-right">Rows</th>
                      </tr>
                    </thead>
                    <tbody>
                      {topPad > 0 && (
                        <tr style={{ height: topPad }}>
                          <td colSpan={3} style={{ padding: 0, border: "none" }} />
                        </tr>
                      )}
                      {sl.map((r, i) => (
                        <tr key={st + i} style={{ height: ROW_H }}>
                          <td>{r.label}</td>
                          <td className="text-right font-mono">{formatCompactNumber(r.metric_value)}</td>
                          <td className="text-right">{r.row_cnt}</td>
                        </tr>
                      ))}
                      {botPad > 0 && (
                        <tr style={{ height: botPad }}>
                          <td colSpan={3} style={{ padding: 0, border: "none" }} />
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
                <p className="text-[11px] mt-2 text-slate-500">
                  {br.length} rows — scroll to browse
                </p>
              </div>
            );
          })()}
          </div>
        </div>
      )}

      {drillOpen && (
        <div
          className="fixed inset-0 z-[100] flex items-center justify-center p-4"
          style={{ background: "rgba(15,23,42,0.55)" }}
          onClick={() => setDrillOpen(false)}
        >
          <div
            className="card w-full max-w-6xl max-h-[88vh] flex flex-col overflow-hidden shadow-2xl bg-white"
            style={{ borderRadius: 16 }}
            onClick={(e) => e.stopPropagation()}
          >
            <div className="flex items-center justify-between px-4 py-3 border-b border-slate-200">
              <div>
                <p className="text-sm font-bold text-slate-800">Drill-through (source rows)</p>
                <p className="text-[11px] text-slate-500">
                  {drillRows.length} rows · virtualized table
                </p>
              </div>
              <button type="button" className="btn-ghost text-xs py-1.5 px-3" onClick={() => setDrillOpen(false)}>
                Close
              </button>
            </div>
            <div
              className="flex-1 overflow-auto table-scroll min-h-0"
              style={{ maxHeight: "72vh" }}
              onScroll={(e) => setVirtScroll(e.target.scrollTop)}
            >
              {drillRows[0] && (
                <table className="data-table text-xs" style={{ minWidth: 520 }}>
                  <thead className="sticky top-0 z-[1] bg-white">
                    <tr>
                      {Object.keys(drillRows[0]).map((k) => (
                        <th key={k}>{k}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {(() => {
                      const cols = Object.keys(drillRows[0]);
                      const start = Math.max(0, Math.floor(virtScroll / ROW_H) - 4);
                      const SL = 32;
